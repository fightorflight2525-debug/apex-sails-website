<div class="panel">
<div class="row"><label>Month</label><input id="mo" type="range" min="1" max="12" value="7"><div class="val" id="moV"></div></div>
<div class="row"><label>Time</label><input id="hr" type="range" min="300" max="1200" step="5" value="750"><div class="val" id="hrV"></div></div>
<div class="chips" id="chips"></div>
<div class="stats">
<div class="stat"><div class="k">Sun elevation</div><div class="v" id="sEl"></div></div>
<div class="stat"><div class="k">Sun azimuth</div><div class="v" id="sAz"></div></div>

<script>
const CFG={"lat": 33.3160815, "lon": -111.8729879, "tzoff": -7, "northCW": 315.0, "pxft": 11.848429526320919, "corners": {"TL": [[485.0, 792.0], 9.916666666666666], "TR": [[753.0, 794.0], 10.0], "BR": [[753.0, 910.0], 9.5], "BL": [[500.0, 983.0], 12.083333333333334]}, "W": 1024, "H": 1536};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),bg=document.getElementById('bg');
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MID=[17,15,16,15,15,11,17,16,15,15,14,10];
function doy(m,d){const c=[0,31,59,90,120,151,181,212,243,273,304,334];return c[m-1]+d;}
function sunpos(m,d,hrs){
 const n=doy(m,d), lat=CFG.lat*Math.PI/180;
 const g=2*Math.PI/365*(n-1+(hrs-12)/24);
 const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
 const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
 const tst=(hrs*60+eqt+4*CFG.lon-60*CFG.tzoff);
 let ha=(tst/4)-180; ha=ha*Math.PI/180;
 const cz=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha);
 const z=Math.acos(Math.max(-1,Math.min(1,cz)));
 const el=90-z*180/Math.PI;
 let az=Math.acos(Math.max(-1,Math.min(1,(Math.sin(dec)-Math.sin(lat)*Math.cos(z))/(Math.cos(lat)*Math.sin(z)))))*180/Math.PI;
 if(ha>0)az=360-az;
 return {el:el,az:az};
}
const C=CFG.corners, K=['TL','TR','BR','BL'];
function edgePts(a,b,n){
 const A=C[a][0],B=C[b][0],ha=C[a][1],hb=C[b][1];
 const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
 const cx=(C.TL[0][0]+C.TR[0][0]+C.BR[0][0]+C.BL[0][0])/4;
 const cy=(C.TL[0][1]+C.TR[0][1]+C.BR[0][1]+C.BL[0][1])/4;
 let vx=cx-mx,vy=cy-my; const L=Math.hypot(B[0]-A[0],B[1]-A[1]);
 const vl=Math.hypot(vx,vy)||1; vx/=vl; vy/=vl;
 const sag=0.03*L;                       // catenary pull-in, B.3
 const out=[];
 for(let i=0;i<n;i++){
  const t=i/n, w=4*t*(1-t);
  const x=A[0]+(B[0]-A[0])*t+vx*sag*w;
  const y=A[1]+(B[1]-A[1])*t+vy*sag*w;
  const h=ha+(hb-ha)*t-0.30*w;           // 0.3 ft mid-edge sag
  out.push([x,y,h]);
 }
 return out;
}
function sailOutline(n){let p=[];for(let i=0;i<4;i++)p=p.concat(edgePts(K[i],K[(i+1)%4],n));return p;}
const OUT=sailOutline(46);
function cast(el,az){
 if(el<=0.6)return null;
 const phi=((az+180+CFG.northCW)%360)*Math.PI/180;
 const t=Math.tan(el*Math.PI/180);
 return OUT.map(p=>{const drop=p[2]/t;return [p[0]+drop*CFG.pxft*Math.sin(phi), p[1]-drop*CFG.pxft*Math.cos(phi)];});
}
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const j=(i+1)%P.length;a+=P[i][0]*P[j][1]-P[j][0]*P[i][1];}return Math.abs(a)/2;}
function draw(){
 const m=+document.getElementById('mo').value, hv=+document.getElementById('hr').value;
 const hrs=hv/60, d=MID[m-1];
 const s=sunpos(m,d,hrs);
 cv.width=CFG.W; cv.height=CFG.H;
 ctx.clearRect(0,0,CFG.W,CFG.H);
 const sh=cast(s.el,s.az);
 let areaFt=0;
 if(sh){
  ctx.beginPath(); ctx.moveTo(sh[0][0],sh[0][1]);
  for(let i=1;i<sh.length;i++)ctx.lineTo(sh[i][0],sh[i][1]);
  ctx.closePath();
  ctx.fillStyle='rgba(16,21,32,0.62)'; ctx.fill();
  ctx.strokeStyle='rgba(10,14,22,0.85)'; ctx.lineWidth=2; ctx.stroke();
  areaFt=polyArea(sh)/(CFG.pxft*CFG.pxft);
 }
 ctx.beginPath(); ctx.moveTo(OUT[0][0],OUT[0][1]);
 for(let i=1;i<OUT.length;i++)ctx.lineTo(OUT[i][0],OUT[i][1]);
 ctx.closePath(); ctx.strokeStyle='rgba(224,138,60,0.95)'; ctx.lineWidth=3; ctx.stroke();
 const hh=Math.floor(hrs), mm=Math.round((hrs-hh)*60);
 const ap=hh>=12?'PM':'AM', h12=((hh+11)%12)+1;
 document.getElementById('moV').textContent=MN[m-1]+' '+d;
 document.getElementById('hrV').textContent=h12+':'+String(mm).padStart(2,'0')+' '+ap;
 document.getElementById('sEl').textContent=s.el>0?s.el.toFixed(1)+'\u00b0':'below horizon';
 document.getElementById('sAz').textContent=s.az.toFixed(1)+'\u00b0';
 const maxh=Math.max(...K.map(k=>C[k][1]));
 document.getElementById('sDr').textContent=s.el>0.6?(maxh/Math.tan(s.el*Math.PI/180)).toFixed(1)+' ft':'\u2014';
 document.getElementById('sAr').textContent=sh?Math.round(areaFt)+' sq ft':'\u2014';
 document.getElementById('nt').innerHTML='Sail area '+SAILFT+' sq ft. Corner heights 12 ft 1 in and 9 ft 11 in at the house, 10 ft and 9 ft 6 in at the poles. '+
  'Sun position computed for this address at latitude '+CFG.lat.toFixed(4)+', longitude '+CFG.lon.toFixed(4)+', Arizona time, no daylight saving. '+
  'Shade is drawn on flat ground, so it reads slightly long where it climbs the wall.';
}
const SAILFT=(function(){const P=OUT.map(p=>[p[0],p[1]]);return Math.round(polyArea(P)/(CFG.pxft*CFG.pxft));})();
const PRE=[['Summer noon',7,12*60],['Summer 8am',7,8*60],['Summer 5pm',7,17*60],['Winter noon',12,12*60],['Spring 4pm',4,16*60]];
const cw=document.getElementById('chips');
PRE.forEach(p=>{const b=document.createElement('div');b.className='chip';b.textContent=p[0];
 b.onclick=()=>{document.getElementById('mo').value=p[1];document.getElementById('hr').value=p[2];
 [...cw.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');draw();};cw.appendChild(b);});
document.getElementById('mo').oninput=draw; document.getElementById('hr').oninput=draw;
if(bg.complete)draw(); else bg.onload=draw;
</script></body></html>
